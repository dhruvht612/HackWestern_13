[project]
name = "attacksurface"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "python-multipart>=0.0.34",
    "ruff>=0.17.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "attacksurface"

[tool.fastapi]
entrypoint = "attacksurface:app"
